services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hackgb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackgb}
      POSTGRES_USER: ${POSTGRES_USER:-hackgb}
      # Dev fallback; override with POSTGRES_PASSWORD in your .env (see .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackgb_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackgb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO's open-source server was archived (Apr 2026) and its Docker images
  # are no longer published. RustFS is a fully S3-compatible drop-in
  # replacement (same ports, works with the AWS SDK, path-style by default).
  rustfs:
    image: rustfs/rustfs:latest
    container_name: hackgb-rustfs
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-hackgb}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-hackgb_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: hackgb-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hackgb-backend
    environment:
      # Compose-network form: user:password@postgres:5432/db. Override the
      # pieces via .env (POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB) or set
      # DATABASE_URL directly.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-hackgb}:${POSTGRES_PASSWORD:-hackgb_dev_password}@postgres:5432/${POSTGRES_DB:-hackgb}}
      # Points at the RustFS container (S3-compatible MinIO replacement)
      MINIO_ENDPOINT: rustfs
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-hackgb}
      MINIO_SECRET_KEY: ${RUSTFS_SECRET_KEY:-hackgb_dev_password}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      PORT: "3001"
      # Chunk 11: JWT signing secret. Dev fallback; set AUTH_JWT_SECRET in .env
      # for anything non-local.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-hackgb-dev-jwt-secret-change-in-prod}

      # ---- LLM Gateway (see .env.example "LLM" section) ----
      # Forward every LLM var into the container so you can point the app at a
      # model server running on your HOST machine (Ollama, LM Studio, llama.cpp,
      # vLLM, etc.). Use the special host `local-host` in the URL to mean "the
      # machine running the app" — it resolves to host.docker.internal inside
      # the container and to 127.0.0.1 when you run the backend natively.
      # Examples:
      #   OLLAMA_URL=http://local-host:11434  LLM_PROVIDER=ollama
      #   OPENAI_BASE_URL=http://local-host:1234/v1  LLM_PROVIDER=openai
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_CHAT_PROVIDER: ${LLM_CHAT_PROVIDER:-}
      LLM_EMBEDDING_PROVIDER: ${LLM_EMBEDDING_PROVIDER:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:1b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-sonnet-4-20250514}
      # Tailscale: if your AI server lives on ANOTHER machine reached over
      # Tailscale (not on this host), set TAILOSCALE_INTERFACE=1 so the backend
      # joins the Tailscale network namespace and can reach peers by their
      # Tailscale IP (100.x.y.z) or MagicDNS name. Leave unset for the normal
      # case (bundled Ollama / host-local server / cloud).
      TAILOSCALE_INTERFACE: ${TAILOSCALE_INTERFACE:-0}
    # host.docker.internal -> the Docker host (172.17.0.1). Needed on Linux;
    # on macOS/Windows Docker Desktop it resolves to the host automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Only attached when TAILOSCALE_INTERFACE=1. Gives the backend its own
    # network namespace wired to the host's Tailscale interface (tail0), so the
    # container can reach Tailscale peers. The backend's own container network
    # (for postgres/rustfs) is unchanged. Requires tailscaled running on the host.
    additionalNetworks:
      tailnet:
        enabled: ${TAILOSCALE_INTERFACE:-0}
        driver: macvlan
        driver_opts:
          parent: ${TAILOSCALE_PARENT_IFACE:-tail0}
          mode: bridge
    ports:
      # Host port is allocated dynamically by scripts/start.sh (first free in
      # 3100-3199) and passed in as BACKEND_PORT. The container always listens
      # on 3001 internally (PORT below).
      - "${BACKEND_PORT:-3100}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      # /api/health is @Public (no auth) so this probe works without a token.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Runs the built production image (CMD node backend/dist/main.js).
    # Rebuild the image after backend changes: `sudo -n docker compose build backend`

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the Next.js build at compile time. scripts/start.sh sets
        # this to the allocated backend port; if it changes, the image is
        # rebuilt (see start.sh).
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:3100}
    container_name: hackgb-frontend
    # Host port is allocated dynamically by scripts/start.sh (first free in
    # 3200-3299) and passed in as FRONTEND_PORT. The container listens on 3000
    # internally (Next.js default).
    ports:
      - "${FRONTEND_PORT:-3200}:3000"
    depends_on:
      - backend
    healthcheck:
      # The Next.js standalone server binds the container's eth0 IP (not
      # loopback), so probe the container hostname ($HOSTNAME resolves to it).
      test: ["CMD-SHELL", "wget -qO- http://$$HOSTNAME:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Runs the built standalone production image (CMD node frontend/server.js).
    # Rebuild the image after frontend changes: `sudo -n docker compose build frontend`

volumes:
  postgres-data:
  rustfs-data:
  ollama-data:
