services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hackgb-postgres
    environment:
      POSTGRES_DB: hackgb
      POSTGRES_USER: hackgb
      POSTGRES_PASSWORD: hackgb_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackgb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO's open-source server was archived (Apr 2026) and its Docker images
  # are no longer published. RustFS is a fully S3-compatible drop-in
  # replacement (same ports, works with the AWS SDK, path-style by default).
  rustfs:
    image: rustfs/rustfs:latest
    container_name: hackgb-rustfs
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: hackgb
      RUSTFS_SECRET_KEY: hackgb_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: hackgb-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hackgb-backend
    environment:
      DATABASE_URL: postgresql://hackgb:hackgb_dev_password@postgres:5432/hackgb
      # Points at the RustFS container (S3-compatible MinIO replacement)
      MINIO_ENDPOINT: rustfs
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: hackgb
      MINIO_SECRET_KEY: hackgb_dev_password
      OLLAMA_URL: http://ollama:11434
      PORT: "3001"
    ports:
      # Host port is allocated dynamically by scripts/start.sh (first free in
      # 3100-3199) and passed in as BACKEND_PORT. The container always listens
      # on 3001 internally (PORT below).
      - "${BACKEND_PORT:-3100}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    # Runs the built production image (CMD node backend/dist/main.js).
    # Rebuild the image after backend changes: `sudo -n docker compose build backend`

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the Next.js build at compile time. scripts/start.sh sets
        # this to the allocated backend port; if it changes, the image is
        # rebuilt (see start.sh).
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:3100}
    container_name: hackgb-frontend
    # Host port is allocated dynamically by scripts/start.sh (first free in
    # 3200-3299) and passed in as FRONTEND_PORT. The container listens on 3000
    # internally (Next.js default).
    ports:
      - "${FRONTEND_PORT:-3200}:3000"
    depends_on:
      - backend
    # Runs the built standalone production image (CMD node frontend/server.js).
    # Rebuild the image after frontend changes: `sudo -n docker compose build frontend`

volumes:
  postgres-data:
  rustfs-data:
  ollama-data:
