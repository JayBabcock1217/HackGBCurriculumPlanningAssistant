services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hackgb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackgb}
      POSTGRES_USER: ${POSTGRES_USER:-hackgb}
      # Dev fallback; override with POSTGRES_PASSWORD in your .env (see .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackgb_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackgb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO's open-source server was archived (Apr 2026) and its Docker images
  # are no longer published. RustFS is a fully S3-compatible drop-in
  # replacement (same ports, works with the AWS SDK, path-style by default).
  rustfs:
    image: rustfs/rustfs:latest
    container_name: hackgb-rustfs
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-hackgb}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-hackgb_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: hackgb-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hackgb-backend
    environment:
      # Compose-network form: user:password@postgres:5432/db. Override the
      # pieces via .env (POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB) or set
      # DATABASE_URL directly.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-hackgb}:${POSTGRES_PASSWORD:-hackgb_dev_password}@postgres:5432/${POSTGRES_DB:-hackgb}}
      # Points at the RustFS container (S3-compatible MinIO replacement)
      MINIO_ENDPOINT: rustfs
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-hackgb}
      MINIO_SECRET_KEY: ${RUSTFS_SECRET_KEY:-hackgb_dev_password}
      # Ollama container for embeddings (LM Manager has no /embeddings). The
      # backend reaches it by container name over the compose network.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      PORT: "3001"
      # Chunk 11: JWT signing secret. Dev fallback; set AUTH_JWT_SECRET in .env
      # for anything non-local.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-hackgb-dev-jwt-secret-change-in-prod}

      # ---- LLM Gateway (see .env.example "LLM" section) ----
      # Chat defaults to your local LM Manager server (llm-gpu-manager), which
      # is OpenAI-compatible and runs on the Docker host. `local-host` in the
      # URL resolves to host.docker.internal inside the container (see
      # extra_hosts below), so the container reaches the host's loopback.
      # Embeddings default to the bundled Ollama container (LM Manager does not
      # expose an embeddings endpoint).
      # Examples (.env overrides):
      #   LM_MANAGER_URL=http://local-host:12340/v1   LLM_PROVIDER=lm-manager
      #   OLLAMA_URL=http://local-host:11434           LLM_EMBEDDING_PROVIDER=ollama
      #   OPENAI_BASE_URL=http://local-host:1234/v1    LLM_PROVIDER=openai
      LLM_PROVIDER: ${LLM_PROVIDER:-lm-manager}
      LLM_CHAT_PROVIDER: ${LLM_CHAT_PROVIDER:-}
      LLM_EMBEDDING_PROVIDER: ${LLM_EMBEDDING_PROVIDER:-ollama}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
      LM_MANAGER_URL: ${LM_MANAGER_URL:-http://local-host:12340/v1}
      LM_MANAGER_CHAT_MODEL: ${LM_MANAGER_CHAT_MODEL:-}
      LM_MANAGER_API_KEY: ${LM_MANAGER_API_KEY:-lm-manager}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:1b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-sonnet-4-20250514}
    # host.docker.internal -> the Docker host. Needed on Linux; on
    # macOS/Windows Docker Desktop it resolves to the host automatically. This
    # is what lets the backend reach a model server (LM Manager, Ollama) running
    # on the machine that runs the app via http://local-host:PORT.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host port is allocated dynamically by scripts/start.sh (first free in
      # 3100-3199) and passed in as BACKEND_PORT. The container always listens
      # on 3001 internally (PORT above).
      - "${BACKEND_PORT:-3100}:3001"
    volumes:
      # Headless Chromium cache for PDF export. The host's puppeteer cache
      # (~/.cache/puppeteer) is mounted read-only so the container can launch
      # the same Chrome build without re-downloading it. If absent, PDF export
      # is unavailable but HTML/DOCX/JSON still work.
      - ${PUPPETEER_CACHE_DIR:-$HOME/.cache/puppeteer}:/home/node/.cache/puppeteer:ro
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      # /api/health is @Public (no auth) so this probe works without a token.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Runs the built production image (CMD node backend/dist/main.js).
    # Rebuild the image after backend changes: `sudo -n docker compose build backend`

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the Next.js build at compile time. scripts/start.sh sets
        # this to the allocated backend port; if it changes, the image is
        # rebuilt (see start.sh).
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:3100}
    container_name: hackgb-frontend
    # Host port is allocated dynamically by scripts/start.sh (first free in
    # 3200-3299) and passed in as FRONTEND_PORT. The container listens on 3000
    # internally (Next.js default).
    ports:
      - "${FRONTEND_PORT:-3200}:3000"
    depends_on:
      - backend
    healthcheck:
      # The Next.js standalone server binds the container's eth0 IP (not
      # loopback), so probe the container hostname ($HOSTNAME resolves to it).
      test: ["CMD-SHELL", "wget -qO- http://$$HOSTNAME:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Runs the built standalone production image (CMD node frontend/server.js).
    # Rebuild the image after frontend changes: `sudo -n docker compose build frontend`

volumes:
  postgres-data:
  rustfs-data:
  ollama-data:
